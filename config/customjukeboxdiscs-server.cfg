# Configuration file

limits {
    # Network chunk payload size in bytes
    I:chunkBytes=31744

    # Maximum storage bytes owned by one player
    S:maxBytesPerPlayer=104857600

    # Maximum decoded duration of a track in seconds
    S:maxDurationSeconds=600

    # Maximum total audio storage bytes on the server
    S:maxServerBytes=2147483648

    # Maximum concurrent upload sessions per player
    I:maxSessionsPerPlayer=1

    # Maximum uploaded audio file size in bytes
    S:maxSourceBytes=26214400

    # Maximum tracks owned by one player
    S:maxTracksPerPlayer=20

    # Allow MP3 audio files
    B:mp3Enabled=true

    # Allow OGG Vorbis audio files
    B:oggEnabled=true

    # Allowed upload rate in bytes/sec per player
    S:uploadBytesPerSecond=524288

    # Inactivity timeout in seconds for uploads
    S:uploadTimeoutSeconds=120
}


url_uploads {
    # Allow server to fetch audio from local private network IPs
    B:allowPrivateAddresses=false

    # Hostnames allowed for URL track downloads
    S:allowedHosts <
        archive.org
        freemusicarchive.org
        cdn.discordapp.com
        media.discordapp.net
        github.io
     >

    # Allow players to write discs from direct https audio links
    B:enabled=true
}


