# Configuration file

general {

    ##########################################################################################################
    # hanf
    #--------------------------------------------------------------------------------------------------------#
    # Hanf-Highs (Joint)
    ##########################################################################################################

    hanf {
        # Chancen für die nächste Stufe, wenn man gerade High I hat (Reihenfolge: I, II, III, IV).
        I:chancenBeiHighI <
            50
            30
            10
            10
         >

        # Chancen für die nächste Stufe, wenn man gerade High II hat (Reihenfolge: I, II, III, IV).
        I:chancenBeiHighII <
            0
            0
            50
            50
         >

        # Chancen für die nächste Stufe, wenn man gerade High III hat (Reihenfolge: I, II, III, IV).
        I:chancenBeiHighIII <
            0
            0
            0
            100
         >

        # Chancen für die nächste Stufe, wenn man gerade High IV hat (Reihenfolge: I, II, III, IV).
        I:chancenBeiHighIV <
            0
            0
            0
            100
         >

        # Chancen für die nächste Stufe, wenn man GERADE KEIN High hat (erster Zug).
        # Vier Zahlen in der Reihenfolge: High I, II, III, IV.
        # Das sind Gewichte: Sie müssen nicht 100 ergeben. 95,2,2,1 heißt 95 von 100 für High I.
        I:chancenOhneHigh <
            95
            2
            2
            1
         >

        # Wie lange jede Stufe anhält, in Sekunden (Reihenfolge: High I, II, III, IV).
        # Die Nebenwirkungen (z. B. Hunger) halten genauso lange.
        # Hinweis: Effekte über etwa 27 Minuten (1600 s) zeigt Minecraft in der Leiste als '**:**' an, sie wirken aber trotzdem.
        I:dauerSekunden <
            600
            300
            180
            180
         >

        # Wie lange die Regeneration bei High I anhält, in Sekunden.
        # Min: 0
        # Max: 3600
        I:regenerationSekunden=180
    }

    ##########################################################################################################
    # meth
    #--------------------------------------------------------------------------------------------------------#
    # Meth-Highs (Meth-Pfeife)
    ##########################################################################################################

    meth {
        # Chancen für die nächste Stufe bei Meth High I (Reihenfolge: I, II, III).
        I:chancenBeiHighI <
            0
            90
            10
         >

        # Chancen für die nächste Stufe bei Meth High II (Reihenfolge: I, II, III).
        I:chancenBeiHighII <
            0
            90
            10
         >

        # Chancen für die nächste Stufe bei Meth High III (Reihenfolge: I, II, III).
        I:chancenBeiHighIII <
            0
            0
            100
         >

        # Chancen für die nächste Stufe, wenn man GERADE KEIN Meth-High hat.
        # Drei Zahlen in der Reihenfolge: Meth High I (Kater), II, III. Es sind Gewichte, sie müssen nicht 100 ergeben.
        I:chancenOhneHigh <
            15
            80
            5
         >

        # Wie lange jede Stufe anhält, in Sekunden (Reihenfolge: Meth High I, II, III).
        # Die Nebenwirkungen halten genauso lange.
        I:dauerSekunden <
            600
            180
            180
         >

        # Wie lange das Gift bei Meth High III anhält, in Sekunden.
        # Min: 0
        # Max: 600
        I:giftSekunden=10

        # Meth High III: längster Abstand zwischen zwei Herz-Schäden, in Sekunden.
        # Min: 1
        # Max: 3600
        I:schadenAbstandMaxSekunden=30

        # Meth High III: kürzester Abstand zwischen zwei Herz-Schäden, in Sekunden.
        # Min: 1
        # Max: 3600
        I:schadenAbstandMinSekunden=20

        # Was bei jedem Herz-Schaden herausfällt. Gewichte in der Reihenfolge: Knochen, Zombiefleisch, Zahn.
        I:schadenDrops <
            25
            25
            50
         >

        # Meth High III: Schaden pro Treffer in Herzen (1.0 = ein ganzes Herz). 0 schaltet Schaden UND die Drops davon ab.
        # Min: 0.0
        # Max: 20.0
        D:schadenHerzen=1.0
    }

    ##########################################################################################################
    # crackhead
    #--------------------------------------------------------------------------------------------------------#
    # Der Crackhead (erscheint bei Meth High III und selten auch in der Welt)
    ##########################################################################################################

    crackhead {
        # Meth High III: Abstand zwischen zwei Crackhead-Auftritten, in Sekunden.
        # Min: 1
        # Max: 3600
        I:abstandSekunden=30

        # Erscheinen bei Meth High III Crackheads? (true/false)
        B:beiMethIII=true

        # Wahrscheinlichkeit in Prozent, dass ein getöteter Crackhead überhaupt etwas fallen lässt.
        # Min: 0
        # Max: 100
        I:dropProzent=60

        # Was er fallen lässt, wenn er etwas fallen lässt. Acht Gewichte in dieser Reihenfolge:
        # Meth, Zigarette, Lederschuhe, Angel, Joint, Bud, Zahn, Meth-Pfeife.
        I:drops <
            32
            16
            11
            11
            9
            9
            8
            4
         >

        # Lebenspunkte in Herzen (1.0 = ein Herz).
        # Min: 0.5
        # Max: 100.0
        D:herzen=1.0

        # Alle wie viele Sekunden nimmt ein Crackhead von selbst Schaden? 0 = nie (er lebt dann, bis man ihn besiegt).
        # Min: 0
        # Max: 3600
        I:selbstschadenAbstandSekunden=0

        # Wie viel Schaden das jeweils ist, in Herzen (0.5 = halbes Herz).
        # Min: 0.0
        # Max: 100.0
        D:selbstschadenHerzen=0.5

        # Wahrscheinlichkeit in Prozent, dass bei einem Auftritt ZWEI statt einem Crackhead kommen.
        # Min: 0
        # Max: 100
        I:zweiterProzent=35
    }

    ##########################################################################################################
    # tabak
    #--------------------------------------------------------------------------------------------------------#
    # Zigaretten, Buzz und Nikotinsucht
    ##########################################################################################################

    tabak {
        # Wie lange der Buzz (Speed + Eile) nach einer Zigarette anhält, in Sekunden.
        # Min: 1
        # Max: 3600
        I:buzzSekunden=600

        # Höchste Chance in Prozent.
        # Min: 0
        # Max: 100
        I:suchtChanceMaxProzent=50

        # Um wie viel Prozentpunkte die Chance mit jeder weiteren Zigarette steigt (bis die Sucht ausbricht).
        # Min: 0
        # Max: 100
        I:suchtChanceSchrittProzent=5

        # Chance in Prozent auf Nikotinsucht bei der ERSTEN Zigarette.
        # Min: 0
        # Max: 100
        I:suchtChanceStartProzent=5

        # Wie lange die Nikotinsucht anhält, in Minuten.
        # Min: 1
        # Max: 600
        I:suchtDauerMinuten=60
    }

    ##########################################################################################################
    # welt
    #--------------------------------------------------------------------------------------------------------#
    # Pflanzen in der Welt und seltene Drops
    ##########################################################################################################

    welt {
        # Natürlicher Crackhead-Spawn: größte Gruppe. Braucht einen Neustart.
        # Min: 1
        # Max: 20
        I:crackheadGruppeMax=2

        # Natürlicher Crackhead-Spawn: kleinste Gruppe. Braucht einen Neustart.
        # Min: 1
        # Max: 20
        I:crackheadGruppeMin=1

        # Natürlicher Crackhead-Spawn: Gewicht (Enderman = 10, Zombie = 100). 0 = spawnen nicht von selbst. Braucht einen Neustart.
        # Min: 0
        # Max: 1000
        I:crackheadSpawnGewicht=10

        # Wilde Ephedra, die Meth-Pflanze (nur im Dschungel): in jedem N-ten Chunk. Gezählt werden alle Chunks, aber nur im Dschungel entsteht etwas. 0 = gar nicht.
        # Min: 0
        # Max: 10000
        I:ephedraAlleNChunks=30

        # Wie viele Pflanzen pro Fleck höchstens wachsen (Ephedra).
        # Min: 1
        # Max: 30
        I:ephedraProFleck=4

        # Wilder Hanf: ungefähr in jedem N-ten Chunk. Größer = seltener. 0 = gar nicht. (Zum Vergleich: Kürbisse kommen etwa alle 32 Chunks vor.)
        # Min: 0
        # Max: 10000
        I:hanfAlleNChunks=100

        # Wie viele Pflanzen pro Fleck höchstens wachsen (Hanf). Pro Versuch gelingt nicht jede.
        # Min: 1
        # Max: 30
        I:hanfProFleck=5

        # Wilder Tabak (in allen Biomen außer Ozean, Pilzinsel, Nether, End): in jedem N-ten Chunk. 0 = gar nicht.
        # Min: 0
        # Max: 10000
        I:tabakAlleNChunks=100

        # Wie viele Pflanzen pro Fleck höchstens wachsen (Tabak).
        # Min: 1
        # Max: 30
        I:tabakProFleck=5

        # Wahrscheinlichkeit in Prozent, dass ein getöteter Villager einen Zahn fallen lässt.
        # Min: 0
        # Max: 100
        I:zahnBeiVillagerProzent=8
    }

    ##########################################################################################################
    # anbau
    #--------------------------------------------------------------------------------------------------------#
    # Wachstum und Knochenmehl der angebauten Pflanzen, Samen aus Gras
    ##########################################################################################################

    anbau {
        # Hanfsamen aus hohem Gras: Gewicht (Weizensamen = 10). 0 = keine. Braucht einen Neustart.
        # Min: 0
        # Max: 100
        I:grasSamenHanfGewicht=1

        # Tabaksamen aus hohem Gras: Gewicht (Weizensamen = 10). 0 = keine. Braucht einen Neustart.
        # Min: 0
        # Max: 100
        I:grasSamenTabakGewicht=1

        # Knochenmehl: um wie viele Wachstumsstufen höchstens.
        # Min: 0
        # Max: 7
        I:knochenmehlMax=4

        # Knochenmehl: um wie viele Wachstumsstufen (von 7) eine Anwendung die Pflanze mindestens weiterbringt.
        # Min: 0
        # Max: 7
        I:knochenmehlMin=2

        # Wachstumsgeschwindigkeit in Prozent. 100 = wie Weizen, 50 = halb so schnell, 200 = doppelt so schnell, 0 = wächst nicht.
        # Gilt für Hanf, Tabak und Ephedra (auch für das Nachwachsen des oberen Blocks).
        # Min: 0
        # Max: 1000
        I:wachstumProzent=100
    }

    ##########################################################################################################
    # ernte_hanf
    #--------------------------------------------------------------------------------------------------------#
    # Ernte der Hanf-Pflanze: was PRO AUSGEWACHSENEM BLOCK herausfällt. Eine Pflanze hat 2 Blöcke, jeder zählt einzeln.
    ##########################################################################################################

    ernte_hanf {
        # Glück-Verzauberung: Um wie viel das Maximum des Hauptdrops pro Glück-Stufe steigt. 0 = Glück wirkt nicht.
        # Min: 0
        # Max: 10
        I:glueckBonusProStufe=1

        # Hanfblätter pro ausgewachsenem Block: höchstens.
        # Min: 0
        # Max: 64
        I:hanfblattMax=3

        # Hanfblätter pro ausgewachsenem Block: mindestens. 0 = keine.
        # Min: 0
        # Max: 64
        I:hanfblattMin=1

        # Hauptdrop pro ausgewachsenem Block: höchstens so viele.
        # Min: 0
        # Max: 64
        I:hauptdropMax=4

        # Hauptdrop pro ausgewachsenem Block: mindestens so viele (Hanf: Buds, Tabak: Tabakblätter).
        # Min: 0
        # Max: 64
        I:hauptdropMin=2

        # Samen pro ausgewachsenem Block: höchstens.
        # Min: 0
        # Max: 64
        I:samenReifMax=3

        # Samen pro AUSGEWACHSENEM Block: mindestens.
        # Min: 0
        # Max: 64
        I:samenReifMin=1

        # Samen pro noch nicht ausgewachsenem Block: höchstens.
        # Min: 0
        # Max: 64
        I:samenUnreifMax=1

        # Samen pro NOCH NICHT ausgewachsenem Block (z. B. wenn man zu früh abbaut): mindestens.
        # Min: 0
        # Max: 64
        I:samenUnreifMin=1
    }

    ##########################################################################################################
    # ernte_tabak
    #--------------------------------------------------------------------------------------------------------#
    # Ernte der Tabak-Pflanze: was PRO AUSGEWACHSENEM BLOCK herausfällt. Hanfblätter fallen hier standardmäßig keine (früher 1-3). Mit 'hanfblattMin/Max' lassen sie sich wieder einschalten.
    ##########################################################################################################

    ernte_tabak {
        # Glück-Verzauberung: Um wie viel das Maximum des Hauptdrops pro Glück-Stufe steigt. 0 = Glück wirkt nicht.
        # Min: 0
        # Max: 10
        I:glueckBonusProStufe=1

        # Hanfblätter pro ausgewachsenem Block: höchstens.
        # Min: 0
        # Max: 64
        I:hanfblattMax=0

        # Hanfblätter pro ausgewachsenem Block: mindestens. 0 = keine.
        # Min: 0
        # Max: 64
        I:hanfblattMin=0

        # Hauptdrop pro ausgewachsenem Block: höchstens so viele.
        # Min: 0
        # Max: 64
        I:hauptdropMax=4

        # Hauptdrop pro ausgewachsenem Block: mindestens so viele (Hanf: Buds, Tabak: Tabakblätter).
        # Min: 0
        # Max: 64
        I:hauptdropMin=2

        # Samen pro ausgewachsenem Block: höchstens.
        # Min: 0
        # Max: 64
        I:samenReifMax=3

        # Samen pro AUSGEWACHSENEM Block: mindestens.
        # Min: 0
        # Max: 64
        I:samenReifMin=1

        # Samen pro noch nicht ausgewachsenem Block: höchstens.
        # Min: 0
        # Max: 64
        I:samenUnreifMax=1

        # Samen pro NOCH NICHT ausgewachsenem Block (z. B. wenn man zu früh abbaut): mindestens.
        # Min: 0
        # Max: 64
        I:samenUnreifMin=1
    }

    ##########################################################################################################
    # ernte_ephedra
    #--------------------------------------------------------------------------------------------------------#
    # Ernte der Ephedra-Pflanze (Meth-Pflanze): was PRO AUSGEWACHSENEM BLOCK herausfällt.
    ##########################################################################################################

    ernte_ephedra {
        # Glück-Verzauberung: Um wie viel das Maximum der Blätter pro Glück-Stufe steigt. 0 = Glück wirkt nicht.
        # Min: 0
        # Max: 10
        I:glueckBonusProStufe=1

        # Ephedra-Blätter pro ausgewachsenem Block: höchstens.
        # Min: 0
        # Max: 64
        I:hauptdropMax=4

        # Ephedra-Blätter pro ausgewachsenem Block: mindestens.
        # Min: 0
        # Max: 64
        I:hauptdropMin=2

        # Samen pro ausgewachsenem Block: höchstens.
        # Min: 0
        # Max: 64
        I:samenReifMax=3

        # Samen pro AUSGEWACHSENEM Block: mindestens.
        # Min: 0
        # Max: 64
        I:samenReifMin=1

        # Samen pro noch nicht ausgewachsenem Block: höchstens.
        # Min: 0
        # Max: 64
        I:samenUnreifMax=1

        # Samen pro NOCH NICHT ausgewachsenem Block: mindestens.
        # Min: 0
        # Max: 64
        I:samenUnreifMin=1
    }

    ##########################################################################################################
    # zahn
    #--------------------------------------------------------------------------------------------------------#
    # Zahn: Womit er sich verwandelt, wenn man mit ihm im Inventar schläft
    ##########################################################################################################

    zahn {
        # Womit sich ein Zahn verwandelt. Eine Zeile pro Möglichkeit, ein Zahn ergibt genau eine davon.
        # Aufbau einer Zeile:   Item;Gewicht;Anzahl;verzaubert     (nur Item und Gewicht sind Pflicht)
        #   Item:      der Name wie bei /give, z. B. minecraft:diamond. Mit Schadenswert/Variante: minecraft:wool:5. Auch Items anderer Mods gehen.
        #   Gewicht:   ganze Zahl. Je größer, desto wahrscheinlicher. Chance = Gewicht geteilt durch die Summe aller Gewichte. 0 schaltet die Zeile aus.
        #   Anzahl:    optional, eine Zahl (3) oder ein Bereich (2-5). Standard 1. (Wird auf die Stapelgröße des Items begrenzt.)
        #   verzaubert: optional. Das Item bekommt zufällige Verzauberungen (Stärke: siehe verzauberungStufeMin/Max).
        # Beispiele:   minecraft:diamond;5   |   minecraft:emerald;2;1-3   |   minecraft:diamond_sword;1;1;verzaubert
        # minecraft:enchanted_book bekommt immer eine zufällige Verzauberung.
        # Fehlerhafte Zeilen (unbekanntes Item, kaputtes Gewicht) werden übersprungen und im Log gemeldet. Ist keine Zeile gültig, gilt die Standardliste.
        S:belohnungen <
            minecraft:diamond;12
            minecraft:gold_ingot;8
            minecraft:emerald;8
            minecraft:enchanted_book;8
            minecraft:diamond_pickaxe;1
            minecraft:diamond_axe;1
            minecraft:diamond_shovel;1
            minecraft:diamond_sword;1
            minecraft:diamond_pickaxe;2;1;verzaubert
            minecraft:diamond_axe;2;1;verzaubert
            minecraft:diamond_shovel;2;1;verzaubert
            minecraft:diamond_sword;2;1;verzaubert
            minecraft:golden_pickaxe;1
            minecraft:golden_axe;1
            minecraft:golden_shovel;1
            minecraft:golden_sword;1
            minecraft:golden_pickaxe;2;1;verzaubert
            minecraft:golden_axe;2;1;verzaubert
            minecraft:golden_shovel;2;1;verzaubert
            minecraft:golden_sword;2;1;verzaubert
            minecraft:fishing_rod;4;1;verzaubert
         >

        # Größte Verzauberungs-Stufe für Zeilen mit 'verzaubert'.
        # Min: 1
        # Max: 100
        I:verzauberungStufeMax=34

        # Kleinste Verzauberungs-Stufe (wie am Zaubertisch, 1-50) für Zeilen mit 'verzaubert'.
        # Min: 1
        # Max: 100
        I:verzauberungStufeMin=15
    }

    ##########################################################################################################
    # optik
    #--------------------------------------------------------------------------------------------------------#
    # Bildeffekte. 'bildfilter', 'kameraWackeln' und 'sichtfeldEffekt' gelten nur für den eigenen Client. 'partikel' und 'halluzinationen' entscheidet der Server (bzw. die Einzelspieler-Welt).
    ##########################################################################################################

    optik {
        # Bildfilter für die Highs (Farbsättigung, Grünstich, Graustufen, RGB-Versatz). false = aus (z. B. bei Grafikproblemen).
        B:bildfilter=true

        # Bildfilter, Kamera-Wackeln und Sichtfeld-Effekt auch bei geöffnetem Inventar/Menü. Standard false: dort ruhiges Bild (verhindert Flackern).
        B:effekteImInventar=false

        # Halluzinations-Geräusche bei Hanf High IV und Meth High III. (Wird vom Server gelesen.)
        B:halluzinationen=true

        # Stärke des Kamera-Wackelns. 1.0 = normal, 0 = aus, 0.5 = halb so stark, 2.0 = doppelt.
        # Min: 0.0
        # Max: 5.0
        D:kameraWackeln=1.0

        # Farbige Partikel um den Spieler beim High. (Wird vom Server gelesen.)
        B:partikel=true

        # Stärke der Sichtfeld-Veränderung (weiter und 'atmend'). 1.0 = normal, 0 = aus.
        # Min: 0.0
        # Max: 5.0
        D:sichtfeldEffekt=1.0
    }

}


